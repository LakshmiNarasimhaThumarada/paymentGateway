spring.application.name=paysecure-backend

server.port=8081

# ===============================
# PROFILES
# ===============================
# Default to 'dev' profile which uses H2 in-memory database.
# Run with -Dspring.profiles.active=mysql to use MySQL.
spring.profiles.active=dev

# ===============================
# DEVTOOLS
# ===============================
spring.devtools.restart.enabled=true

# ===============================
# LOGGING
# ===============================
logging.level.org.springframework=INFO